{% extends "layout.html" %}

{% block title %}Resultados del Análisis{% endblock %}

{% block content %}
    <h1>📊 Resultados del análisis</h1>
    
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
        {% for r in resultados %}
        <div class="glass-container" style="max-width: 450px;">
            <h2 style="color: white; font-size: 1.1rem;">{{ r.filename }}</h2>
            <img src="/{{ r.filepath }}" alt="Imagen original" class="preview" style="max-height: 12rem;">
            <img src="/{{ r.histograma }}" alt="Histograma" class="preview" style="max-height: 12rem;">
            <pre style="text-align: left; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; font-size: 0.8rem; overflow-x: auto; width: 100%;">
                {{ r.stats | tojson(indent=2) }}
            </pre>
        </div>
        {% endfor %}
    </div>

    <a href="/" class="btn-std" style="margin: 30px;">⬅️ Volver</a>
{% endblock %}
