<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detección de enfermedad</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
form { margin-top: 30px; }
input[type=file] { margin: 10px; }
button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
button:hover { background: #45a049; }
</style>
</head>
<body>
<h1>🌿 Detección de Enfermedad en Hojas de Soja</h1>
<p>Subí una imagen de hoja para detectar su posible enfermedad.</p>

<form action="/detectar_enfermedad" method="POST" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required>
    <br>
    <button type="submit">Analizar</button>
</form>

<a href="/">⬅ Volver al inicio</a>
</body>
</html>
