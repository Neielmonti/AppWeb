<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de enfermedad</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: 
                linear-gradient(rgba(244, 246, 248, 0.0),rgba(255, 255, 255, 0.0), rgba(0, 0, 0, 0.7)),
                url("static/images/background_soybean.jpeg");
            background-size: cover;
            background-repeat: no-repeat;
            /* background: #f4f6f8; */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: rgb(6, 50, 40);
            margin-top: 5px;
            margin-bottom: 5px;
            font-family: "Montserrat", sans-serif !important;
        }

        p {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        form {
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            background: rgb(6, 50, 40);
            padding: 25px;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            max-width: fit-content;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(18, 1, 44, 0.4);
        }

        input[type=file] {
            color: white;
            font-family: "Rubik", sans-serif !important;
            margin: 15px;
            margin-top: 0;
            font-size: 15px;
        }

        button {
            font-family: "Rubik", sans-serif;
            padding: 12px 25px;
            background: rgb(62, 177, 106);
            color: white;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background: rgb(43, 132, 73);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        iframe {
            padding: 1.5rem;
            border: none;
            width: 100%;
            max-width: 60rem;
            min-height: 55rem;
            overflow: hidden; /* <<--- SIN SCROLL */
            margin-top: 1rem;
            border-radius: 1rem;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.7);
            background: rgb(6, 50, 40);
        }

        a {
            display: block;
            margin-top: 30px;
            text-decoration: none;
            color: rgb(66,188,113);
            font-weight: bolder;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Detección de Enfermedad en Hojas de Soja</h1>
    <p>Subí una imagen de hoja para detectar su posible enfermedad mediante IA.</p>

    <form action="/detectar_enfermedad" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit"> Analizar imagen 🔍</button>
    </form>

    <h1>Métricas del modelo</h1>
    <p>Visualización interactiva del desempeño del modelo de clasificación</p>

    <!-- EMBEBIDO DASH -->
    <iframe src="/dash/" title="Dashboard Métricas del Modelo"></iframe>

    <a href="/">⬅ Volver al inicio</a>

</body>
</html>
