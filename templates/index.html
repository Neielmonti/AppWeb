<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Procesamiento de Imágenes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');

        /* ESTILOS COMBINADOS Y ACTUALIZADOS */
        body {
            font-family: "Rubik", sans-serif; /* Usamos una de las fuentes importadas */
            text-align: center;
            padding: 40px;
            background: 
                linear-gradient(rgba(244, 246, 248, 0.0),rgba(255, 255, 255, 0.0), rgba(0, 0, 0, 0.7)),
                url("static/images/background_soybean.jpeg");
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white; /* Cambiado a blanco para mejor contraste con el fondo */
            font-size: 1.2rem; /* Tamaño de fuente ligeramente ajustado */
            line-height: 1.5;
            min-height: 100vh;
        }

        h1 {
            color: rgb(6, 50, 40); /* Color de título de la nueva hoja de estilo */
            margin-top: 5px;
            margin-bottom: 5px;
            font-family: "Montserrat", sans-serif !important;
            font-size: 2.5rem; /* Hago el título más grande */
        }

        p {
          color: rgb(6, 50, 40); /* Color de título de la nueva hoja de estilo */
          margin-top: 5px;
          margin-bottom: 5px;
          font-family: "Montserrat", sans-serif !important;
          font-size: 1.5rem; /* Hago el título más grande */
        }

        form {
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            background: rgb(6, 50, 40);
            padding: 25px;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            max-width: fit-content;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(18, 1, 44, 0.4);
        }

        input[type=file] {
            color: white;
            font-family: "Rubik", sans-serif !important;
            margin: 15px;
            margin-top: 0;
            font-size: 15px;
        }

        button {
            font-family: "Rubik", sans-serif;
            padding: 12px 25px;
            background: rgb(62, 177, 106);
            color: white;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s ease, color 0.2s ease;
            /* Se eliminó el margen izquierdo de 10px que estaba en la versión anterior */
        }

        button:hover {
            background: rgb(43, 132, 73);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Los estilos iframe se mantienen por si se añaden más tarde, pero no son necesarios para el código HTML actual */
        iframe {
            padding: 1.5rem;
            border: none;
            width: 100%;
            max-width: 60rem;
            min-height: 55rem;
            overflow: hidden;
            margin-top: 1rem;
            border-radius: 1rem;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.7);
            background: rgb(6, 50, 40);
        }

        .button-64 {
          align-items: center;
          background-image: linear-gradient(144deg, rgb(35, 30, 100), rgb(40, 66, 243) 50%, rgb(0, 221, 235));
          border: 0;
          border-radius: 8px;
          box-shadow: rgba(151, 65, 252, 0.3) 0 15px 30px -5px;
          box-sizing: border-box;
          color: rgb(0, 221, 235);
          display: flex;
          font-family: Phantomsans, sans-serif;
          font-size: 20px;
          justify-content: center;
          line-height: 1em;
          max-width: 100%;
          min-width: 140px;
          padding: 3px;
          text-decoration: none;
          user-select: none;
          -webkit-user-select: none;
          touch-action: manipulation;
          white-space: nowrap;
          cursor: pointer;
        }

        .button-64:active,
        .button-64:hover {
          box-shadow: rgba(151, 65, 252, 0.5) 0 15px 30px -5px;
          outline: 0;
          color: rgb(17, 27, 48);
        }

        .button-64 span {
          background-color: rgb(17, 27, 48);
          padding: 16px 24px;
          border-radius: 6px;
          width: 100%;
          height: 100%;
          transition: 300ms;
        }

        .button-64:hover span {
          background: none;
        }

        @media (min-width: 768px) {
          .button-64 {
            font-size: 24px;
            min-width: 196px;
          }
        }
    </style>
  </head>
  <body>
    <h1>Analizador de Imágenes</h1>
    <p>Subí una imagen para ver sus estadísticas.</p>
    <form method="post" enctype="multipart/form-data">
    <input type="file" name="files" accept="image/*" multiple required>
    <button type="submit">Subir y Analizar</button>
    </form>
    <a href="/detectar_enfermedad" class="button-64"><span class="text">Detectar enfermedades en Soja</span></a>
  </body>
</html>
