{% extends "layout.html" %}

{% block content %}
    <h1>Analizador de Imágenes</h1>
    <p>Subí una imagen para ver sus estadísticas.</p>
    
      <form method="post" enctype="multipart/form-data">
          <input type="file" name="files" accept="image/*" multiple required>
          <button type="submit">Subir y Analizar</button>
      </form>

    <a href="/detectar_enfermedad" class="button-64">
        <span class="text">Detectar enfermedades en Soja</span>
    </a>
{% endblock %}
