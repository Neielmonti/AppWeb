{% extends "layout.html" %}

{% block title %}Resultado de Detección{% endblock %}

{% block content %}
    <h1>Resultado del Análisis</h1>

    <div class="glass-container">
        <img 
            src="{{ url_for('static', filename= 'images/no_soja.jpg' if 'no_soja.jpg' in filename else 'uploads/' + filename) }}" 
            alt="Imagen de resultado"
            class="preview"
        >
        <h2 style="color: white; font-weight: 300;">Predicción: {{ pred_class }}</h2>
        <p>Confianza: <span class="confianza-valor">{{ pred_conf }}%</span></p>
    </div>

    <div style="display: flex; gap: 10px;">
        <a href="/detectar_enfermedad" class="btn-std">Analizar otra imagen 🔄</a>
        <a href="/" class="btn-std" style="background: #444;">Volver al inicio 🏠</a>
    </div>
{% endblock %}
